name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assist-systemd:
    name: Linux Assist start and recovery rehearsal
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.0
        with:
          version: "0.13.4"
      - name: Exercise temporary systemd units with a synthetic budget and credential
        run: |
          set -euo pipefail
          runtime_dir="$(sudo mktemp -d /opt/stackchan-assist-ci.XXXXXXXX)"
          trap 'sudo rm -rf -- "$runtime_dir"' EXIT
          sudo chown "$(id -u):$(id -g)" "$runtime_dir"
          chmod 755 "$runtime_dir"
          UV_PROJECT_ENVIRONMENT="$runtime_dir/venv" uv sync --frozen --no-dev --no-editable
          sudo env GITHUB_ACTIONS=true "$runtime_dir/venv/bin/python" \
            scripts/ci_assist_systemd.py "$runtime_dir" "$(id -u)" "$(id -g)"

  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux codec
        if: runner.os == 'Linux'
        run: |
          # Keep codec setup off the runner's shared mirror list.
          sources_dir="$(mktemp -d "$RUNNER_TEMP/stackchan-apt.XXXXXX")"
          cat > "$sources_dir/ubuntu.sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          apt_options=(
            -o Dir::Etc::sourcelist=/dev/null
            -o "Dir::Etc::sourceparts=$sources_dir"
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install --yes libopus0 libcjson-dev
      - name: Install locked dependencies
        run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Offline test suite
        run: uv run --frozen pytest -q -ra --junitxml=.local/ci/junit.xml
      - name: Offline standalone C++ safety, wake, and SCFG enrollment tests (host only)
        if: runner.os == 'Linux'
        run: uv run --frozen pytest -q firmware/standalone/tests
      - name: Build native Windows PC wake helper (no device)
        if: runner.os == 'Windows'
        run: |
          mkdir -p .local/ci
          uv tool run --from ziglang==0.15.2 python-zig c++ -std=c++20 -O2 -s -Wall -Wextra -Werror -pedantic -Ifirmware/standalone/core firmware/standalone/tools/wake_stage1_probe.cpp -o .local/ci/wake-stage1.exe
          python -c "import os; from pathlib import Path; p=Path('.local/ci/wake-stage1.exe').resolve(); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('STACKCHAN_TEST_WAKE_PROBE_EXE='+str(p)+'\n')"
      - name: PC microphone arithmetic and private enrollment (synthetic only)
        run: uv run --frozen --with numpy==2.3.5 pytest -q firmware/standalone/tests/test_pc_mic_audio.py firmware/standalone/tests/test_pc_mic_wake_probe.py firmware/standalone/tests/test_pc_mic_enroll.py
      - name: Offline SCPS P-256 / AES-GCM authenticated pairing fixtures (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run --frozen --with cryptography==46.0.4 python -m pytest -q firmware/standalone/tests/test_scps_reference.py firmware/standalone/tests/test_scps_usb_serial.py
      - name: Accelerated virtual 24-hour stability scenario
        run: uv run --frozen stackchan-soak --cycles 2880 --virtual-step-s 30 --diagnostics --report .local/ci/soak.json
      - name: Build distributions
        run: uv build --no-sources --out-dir .local/ci/dist
      - name: Verify independent wheel installation (Linux, including Opus)
        if: runner.os == 'Linux'
        run: uv run --frozen python scripts/ci_verify.py --require-opus
      - name: Verify independent wheel installation (Windows)
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/ci_verify.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .local/ci/junit.xml
            .local/ci/soak.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
