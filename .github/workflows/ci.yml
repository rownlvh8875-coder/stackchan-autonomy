name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux codec
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libopus0
      - name: Install locked dependencies
        run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Offline test suite
        run: uv run --frozen pytest -q -ra --junitxml=.local/ci/junit.xml
      - name: Accelerated virtual 24-hour stability scenario
        run: uv run --frozen stackchan-soak --cycles 2880 --virtual-step-s 30 --report .local/ci/soak.json
      - name: Build distributions
        run: uv build --no-sources --out-dir .local/ci/dist
      - name: Verify independent wheel installation (Linux, including Opus)
        if: runner.os == 'Linux'
        run: uv run --frozen python scripts/ci_verify.py --require-opus
      - name: Verify independent wheel installation (Windows)
        if: runner.os == 'Windows'
        run: uv run --frozen python scripts/ci_verify.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .local/ci/junit.xml
            .local/ci/soak.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
